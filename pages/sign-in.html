<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="apple-touch-icon" sizes="76x76" href="../assets/img/apple-icon.png">
  <link rel="icon" type="image/png" href="../assets/img/favicon.png">
  <title>Sign in - CMS-PPA</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <script>
    if (localStorage.getItem("auth-theme") === "dark") {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  </script>
  <style>
    :root {
      --auth-bg: #fafafa;
      --auth-card: #ffffff;
      --auth-ink: #171717;
      --auth-secondary: #525252;
      --auth-muted: #737373;
      --auth-line: rgba(23, 23, 23, 0.08);
      --auth-field: #ffffff;
      --auth-accent: #c2410c;
      --auth-down: #dc2626;
      --auth-ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    html[data-theme="dark"] {
      --auth-bg: #141415;
      --auth-card: #19191b;
      --auth-ink: #ededed;
      --auth-secondary: #a1a1a6;
      --auth-muted: #85858b;
      --auth-line: rgba(237, 237, 237, 0.08);
      --auth-field: #141415;
      --auth-accent: #fb923c;
      --auth-down: #e5484d;
      color-scheme: dark;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: var(--auth-bg);
      color: var(--auth-ink);
      font-family: "IBM Plex Sans", sans-serif;
      font-weight: 400;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .auth-screen {
      height: 100%;
      overflow: auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 420px);
      align-items: center;
      gap: 64px;
      max-width: 960px;
      margin: 0 auto;
      padding: 32px;
      box-sizing: border-box;
      animation: auth-in 320ms var(--auth-ease);
    }

    @keyframes auth-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }

    .auth-mark {
      display: inline-flex;
      color: var(--auth-accent);
      margin-bottom: 16px;
    }

    .auth-kicker {
      margin: 0 0 8px;
      font-size: 16px;
      line-height: 20px;
      font-weight: 500;
    }

    .auth-screen h1 {
      margin: 0;
      font-size: 36px;
      line-height: 1.15;
      font-weight: 500;
      letter-spacing: 0;
    }

    .auth-lead {
      max-width: 28rem;
      margin: 12px 0 0;
      color: var(--auth-secondary);
      font-size: 16px;
      line-height: 24px;
    }

    .auth-card {
      background: var(--auth-card);
      border: 1px solid var(--auth-line);
      border-radius: 16px;
      padding: 24px;
    }

    .auth-card form {
      display: block;
      width: 100%;
    }

    .field {
      position: relative;
      display: block;
      width: 100%;
      margin: 0 0 12px;
    }

    .field:last-of-type {
      margin-bottom: 16px;
    }

    .field svg {
      position: absolute;
      left: 12px;
      top: 16px;
      width: 16px;
      height: 16px;
      color: var(--auth-muted);
      pointer-events: none;
    }

    .field input {
      display: block;
      box-sizing: border-box;
      width: 100%;
      height: 48px;
      padding: 0 12px 0 36px;
      border: 1px solid var(--auth-line);
      border-radius: 8px;
      background: var(--auth-field);
      color: var(--auth-ink);
      font: inherit;
      font-size: 15px;
      outline: none;
      transition: border-color 160ms var(--auth-ease);
    }

    .field input::placeholder {
      color: var(--auth-muted);
    }

    .field input:focus {
      border-color: var(--auth-ink);
    }

    .field input:focus-visible {
      outline: 2px solid var(--auth-ink);
      outline-offset: 2px;
    }

    .auth-submit {
      width: 100%;
      height: 44px;
      border: 0;
      border-radius: 8px;
      background: var(--auth-ink);
      color: var(--auth-bg);
      font: inherit;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 160ms var(--auth-ease), transform 120ms var(--auth-ease);
    }

    .auth-submit:hover {
      background: var(--auth-secondary);
    }

    .auth-submit:active {
      transform: scale(0.98);
    }

    .auth-submit:focus-visible {
      outline: 2px solid var(--auth-ink);
      outline-offset: 2px;
    }

    .auth-submit:disabled {
      cursor: progress;
      opacity: 0.7;
    }

    .field input.is-invalid {
      border-color: var(--auth-down);
    }

    .auth-error {
      display: none;
      margin: 0 0 12px;
      color: var(--auth-down);
      font-size: 14px;
      line-height: 20px;
    }

    .auth-error.is-visible {
      display: block;
    }

    .theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 36px;
      padding: 0 12px;
      border: 1px solid var(--auth-line);
      border-radius: 8px;
      background: var(--auth-card);
      color: var(--auth-secondary);
      font: inherit;
      font-size: 14px;
      font-weight: 400;
      cursor: pointer;
      transition: background-color 160ms var(--auth-ease), color 160ms var(--auth-ease);
    }

    .theme-toggle:hover {
      background: var(--auth-bg);
      color: var(--auth-ink);
    }

    .theme-toggle:focus-visible {
      outline: 2px solid var(--auth-ink);
      outline-offset: 2px;
    }

    .theme-toggle svg {
      width: 16px;
      height: 16px;
    }

    html[data-theme="dark"] .icon-moon,
    html:not([data-theme="dark"]) .icon-sun {
      display: none;
    }

    @media (max-width: 800px) {
      .auth-screen {
        grid-template-columns: 1fr;
        gap: 24px;
        align-content: center;
      }

      .auth-screen h1 {
        font-size: 32px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .auth-screen,
      .auth-submit,
      .field input,
      .theme-toggle {
        animation: none;
        transition: none;
      }

      .auth-submit:active {
        transform: none;
      }
    }
  </style>
</head>

<body>
  <button type="button" class="theme-toggle" id="theme-toggle" aria-pressed="false">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
      <path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"></path>
    </svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
      <circle cx="12" cy="12" r="4"></circle>
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
    </svg>
    <span class="theme-label">Dark mode</span>
  </button>
  <main class="auth-screen">
    <div class="auth-intro">
      <span class="auth-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.5"></circle><path d="M12 3v2.5"></path><path d="M12 18.5V21"></path><path d="M3 12h2.5"></path><path d="M18.5 12H21"></path></svg>
      </span>
      <p class="auth-kicker">CMS-PPA</p>
      <h1>Sign in</h1>
      <p class="auth-lead">Username and password for the credentials desk</p>
    </div>
    <section class="auth-card">
      <form role="form" id="sign-in-form" method="post" action="#" novalidate>
        <p class="auth-error" id="auth-error" role="alert"></p>
        <label class="field">
          <span class="visually-hidden">Username</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <circle cx="12" cy="8" r="3.2"></circle>
            <path d="M5 19.2c1.3-2.6 3.8-3.9 7-3.9s5.7 1.3 7 3.9"></path>
          </svg>
          <input type="text" name="username" placeholder="Username" autocomplete="username" required>
        </label>
        <label class="field">
          <span class="visually-hidden">Password</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <rect x="5" y="11" width="14" height="10" rx="2"></rect>
            <path d="M8 11V8a4 4 0 0 1 8 0v3"></path>
          </svg>
          <input type="password" name="password" placeholder="Password" autocomplete="current-password" required>
        </label>
        <button class="auth-submit" type="submit" id="sign-in-submit">
          <span class="auth-submit-label">Sign in</span>
        </button>
      </form>
    </section>
  </main>
  <script>
    (function () {
      var toggle = document.getElementById("theme-toggle");
      var label = toggle.querySelector(".theme-label");

      function applyTheme(theme) {
        var dark = theme === "dark";
        document.documentElement.toggleAttribute("data-theme", dark);
        if (dark) {
          document.documentElement.setAttribute("data-theme", "dark");
          localStorage.setItem("auth-theme", "dark");
        } else {
          document.documentElement.removeAttribute("data-theme");
          localStorage.setItem("auth-theme", "light");
        }
        toggle.setAttribute("aria-pressed", dark ? "true" : "false");
        label.textContent = dark ? "Light mode" : "Dark mode";
      }

      applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light");
      toggle.addEventListener("click", function () {
        var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
        applyTheme(next);
      });

    })();
  </script>
  <script src="../js/config.js?v=1.6.0"></script>
  <script src="../js/api.js"></script>
  <script src="../js/sign-in.js" defer></script>
</body>

</html>
